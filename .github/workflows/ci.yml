name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Vercel deployment variables
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ============================================================
  # STAGE 1: Unit Tests
  # ============================================================
  test-server:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'
      - name: Install dependencies
        working-directory: ./server
        run: npm ci || npm install
      - name: Run tests
        working-directory: ./server
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
        run: npm test

  test-client:
    name: Client Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'
      - name: Install dependencies
        working-directory: ./client
        run: npm ci || npm install --legacy-peer-deps
      - name: Run tests
        working-directory: ./client
        run: npm test -- --watchAll=false

  # ============================================================
  # STAGE 2: E2E Tests (Selenium + Docker)
  # ============================================================
  e2e-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: [test-server, test-client]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'
      
      - name: Create Docker network
        run: docker network create e2e-network

      - name: Start Selenium Chrome
        run: |
          docker run -d \
            --name selenium \
            --network e2e-network \
            -p 4444:4444 \
            --shm-size=2g \
            selenium/standalone-chrome:latest

      - name: Start MongoDB
        run: |
          docker run -d \
            --name mongodb \
            --network e2e-network \
            mongo:latest
          
      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB to be ready..."
          sleep 5
          docker exec mongodb mongosh --eval "db.adminCommand('ping')" || \
          docker exec mongodb mongo --eval "db.adminCommand('ping')" || \
          sleep 10

      - name: Build and Start Server
        run: |
          docker build -t signature-server ./server
          docker run -d \
            --name server \
            --network e2e-network \
            -p 5000:5000 \
            -e PORT=5000 \
            -e CLIENT_URL=http://client:80 \
            -e MONGODB_URI=mongodb://mongodb:27017/signature-app \
            -e JWT_SECRET=e2e-test-secret \
            signature-server

      - name: Build and Start Client
        run: |
          docker build -t signature-client ./client
          docker run -d \
            --name client \
            --network e2e-network \
            -p 3000:80 \
            signature-client

      - name: Wait for services
        run: |
          echo "Waiting for services..."
          sleep 20
          curl -f http://localhost:5000/ || (docker logs server && exit 1)
          curl -f http://localhost:3000/ || (docker logs client && exit 1)

      - name: Run E2E tests
        working-directory: ./e2e
        env:
          APP_URL: http://client
          SELENIUM_URL: http://localhost:4444/wd/hub
        run: |
          npm ci || npm install
          node auth.spec.js
      
      - name: Debug Logs on failure
        if: failure()
        run: |
          echo "SERVER LOGS:"
          docker logs server
          echo "CLIENT LOGS:"
          docker logs client
          echo "MONGODB LOGS:"
          docker logs mongodb

      - name: Cleanup
        if: always()
        run: |
          docker stop server client selenium mongodb 2>/dev/null || true
          docker rm server client selenium mongodb 2>/dev/null || true
          docker network rm e2e-network 2>/dev/null || true

  # ============================================================
  # STAGE 3: Deploy to Vercel
  # ============================================================
  deploy:
    name: Deploy to Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
